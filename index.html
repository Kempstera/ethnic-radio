<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F5F7FA">
<title>华韵集 · 中国少数民族广播电台</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%93%BB%3C/text%3E%3C/svg%3E">
<style>
  /* ============ 基础 ============ */
  *,*::before,*::after{box-sizing:border-box}
  [hidden]{display:none !important}
  html,body{margin:0;padding:0}
  body{
    min-height:100vh;
    background:#F5F7FA;
    color:#1D1D1F;
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro SC","SF Pro Text","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Helvetica Neue",Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
    -webkit-tap-highlight-color:transparent;
    padding-bottom:132px;
  }
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
  h1,h2,h3,p{margin:0}
  a{color:#0071E3;text-decoration:none}

  /* ============ 加载遮罩 ============ */
  .overlay{
    position:fixed;inset:0;z-index:120;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;
    background:rgba(245,247,250,.94);
    -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
    transition:opacity .32s ease,visibility .32s ease;
  }
  .overlay.hide{opacity:0;visibility:hidden}
  .spinner{
    width:38px;height:38px;border-radius:50%;
    border:3px solid rgba(0,0,0,.08);border-top-color:#0071E3;
    animation:spin .8s linear infinite;
  }
  .overlay p{font-size:15px;color:#86868B}
  @keyframes spin{to{transform:rotate(360deg)}}

  /* ============ 提示条 / Toast ============ */
  .notice{
    max-width:1000px;margin:20px auto -12px;padding:12px 20px;
    background:#FFF7E6;border:1px solid #FFE0A3;border-radius:14px;
    color:#8A5B00;font-size:14px;line-height:1.5;text-align:center;
  }
  .toast{
    position:fixed;top:24px;left:50%;transform:translate(-50%,-16px);
    z-index:200;max-width:calc(100% - 40px);
    padding:12px 22px;border-radius:999px;
    background:rgba(255,255,255,.86);
    -webkit-backdrop-filter:blur(20px) saturate(180%);backdrop-filter:blur(20px) saturate(180%);
    box-shadow:0 8px 32px rgba(0,0,0,.12);
    font-size:14.5px;color:#1D1D1F;
    opacity:0;pointer-events:none;transition:opacity .28s ease,transform .28s ease;
  }
  .toast.on{opacity:1;transform:translate(-50%,0)}

  /* ============ 主屏幕 · 导航页 ============ */
  .view{animation:fade .28s ease}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

  .home-head{max-width:1000px;margin:0 auto;padding:76px 24px 44px;text-align:center}
  .home-head h1{font-size:44px;font-weight:700;letter-spacing:-1px;line-height:1.15}
  .home-head p{margin-top:14px;font-size:17px;color:#86868B;letter-spacing:.2px}

  .cat-grid{
    max-width:1000px;margin:0 auto;padding:0 24px;
    display:grid;gap:20px;
    grid-template-columns:repeat(auto-fit,minmax(230px,1fr));
  }
  .cat-card{
    display:flex;flex-direction:column;align-items:center;gap:10px;
    padding:38px 22px 32px;border-radius:20px;
    background:#FFFFFF;
    box-shadow:0 4px 20px rgba(0,0,0,.05);
    transition:transform .25s cubic-bezier(.22,.8,.3,1),box-shadow .25s ease;
    text-align:center;
  }
  .cat-card:hover{transform:translateY(-5px);box-shadow:0 14px 34px rgba(0,0,0,.10)}
  .cat-card:active{transform:translateY(-1px) scale(.99)}
  .cat-emoji{font-size:38px;line-height:1}
  .cat-label{font-size:20px;font-weight:600;letter-spacing:.3px}
  .cat-sub{font-size:13.5px;color:#A1A1A6}
  .cat-count{margin-top:4px;font-size:13px;color:#0071E3;font-weight:500}

  /* ============ 列表屏幕 · 详情页 ============ */
  .list-bar{
    position:sticky;top:0;z-index:60;
    background:rgba(245,247,250,.82);
    -webkit-backdrop-filter:blur(20px) saturate(180%);backdrop-filter:blur(20px) saturate(180%);
    padding:18px 24px 14px;
  }
  .list-bar-inner{
    max-width:1200px;margin:0 auto;
    display:flex;align-items:center;gap:16px;flex-wrap:wrap;
  }
  .btn-back{
    display:inline-flex;align-items:center;gap:7px;
    padding:10px 20px;border-radius:999px;
    background:#FFFFFF;color:#1D1D1F;
    font-size:15px;font-weight:600;
    box-shadow:0 4px 20px rgba(0,0,0,.05);
    transition:transform .2s ease,box-shadow .2s ease,color .2s ease;
    flex:0 0 auto;
  }
  .btn-back:hover{color:#0071E3;transform:translateX(-2px);box-shadow:0 8px 24px rgba(0,0,0,.09)}
  .list-title{font-size:26px;font-weight:700;letter-spacing:-.4px}
  .list-count{margin-left:auto;font-size:14px;color:#86868B;white-space:nowrap}

  .station-grid{
    max-width:1200px;margin:0 auto;padding:20px 24px 40px;
    display:grid;gap:16px;
    grid-template-columns:repeat(auto-fill,minmax(270px,1fr));
  }
  .station-card{
    display:flex;flex-direction:column;gap:14px;
    padding:20px;border-radius:16px;
    background:#FFFFFF;
    box-shadow:0 4px 20px rgba(0,0,0,.05);
    transition:transform .25s cubic-bezier(.22,.8,.3,1),box-shadow .25s ease;
  }
  .station-card:hover{transform:translateY(-4px);box-shadow:0 12px 30px rgba(0,0,0,.09)}
  .station-card.is-current{box-shadow:0 0 0 2px rgba(0,113,227,.35),0 12px 30px rgba(0,0,0,.09)}
  .s-name{font-size:17px;font-weight:600;line-height:1.4;letter-spacing:.1px;word-break:break-word}
  .s-cat{font-size:13px;color:#86868B;margin-top:6px}
  .s-tags{display:flex;gap:6px;flex-wrap:wrap}
  .s-tag{
    font-size:11.5px;padding:4px 10px;border-radius:999px;
    background:#F5F7FA;color:#6E6E73;
    max-width:170px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }
  .s-foot{display:flex;align-items:center;gap:10px;margin-top:auto}
  .s-meta{font-size:12px;color:#A1A1A6}
  .s-play{
    margin-left:auto;width:42px;height:42px;flex:0 0 42px;border-radius:50%;
    display:grid;place-items:center;
    background:#0071E3;color:#FFFFFF;
    transition:transform .2s ease,background .2s ease,filter .2s ease;
  }
  .s-play:hover{filter:brightness(1.06);transform:scale(1.06)}
  .s-play svg{width:17px;height:17px;display:block}
  .station-card.is-current .s-play{background:#1D1D1F}
  .station-card.is-dead{opacity:.6}
  .station-card.is-dead .s-play{background:#C7C7CC;box-shadow:none}
  .station-card.is-dead .s-play:hover{filter:none;transform:none}
  .s-tag.dead{background:#FFF0EF;color:#C0392B}

  .empty{
    grid-column:1/-1;text-align:center;padding:80px 24px;
    color:#86868B;font-size:15.5px;line-height:1.7;
  }

  /* ============ 底部悬浮播放器 ============ */
  .player{
    position:fixed;left:50%;bottom:18px;z-index:90;
    width:min(940px,calc(100% - 28px));
    transform:translate(-50%,150%);
    opacity:0;pointer-events:none;
    display:flex;align-items:center;gap:16px;flex-wrap:wrap;
    padding:14px 18px;border-radius:24px;
    background:rgba(255,255,255,.72);
    -webkit-backdrop-filter:blur(28px) saturate(180%);backdrop-filter:blur(28px) saturate(180%);
    border:1px solid rgba(0,0,0,.05);
    box-shadow:0 8px 40px rgba(0,0,0,.13);
    transition:transform .34s cubic-bezier(.22,.8,.3,1),opacity .34s ease;
  }
  .player.up{transform:translate(-50%,0);opacity:1;pointer-events:auto}
  .p-art{
    width:50px;height:50px;flex:0 0 50px;border-radius:14px;
    display:grid;place-items:center;font-size:20px;
    background:#F5F7FA;color:#0071E3;
    transition:background .25s ease,color .25s ease;
  }
  .player.is-playing .p-art{background:rgba(0,113,227,.10)}
  .player.is-error .p-art{background:rgba(255,59,48,.10);color:#FF3B30}
  .p-art .bars{display:flex;align-items:flex-end;gap:3px;height:20px}
  .p-art .bars span{width:3px;border-radius:2px;background:#0071E3;animation:eq 1s ease-in-out infinite}
  .p-art .bars span:nth-child(1){height:9px;animation-delay:0s}
  .p-art .bars span:nth-child(2){height:19px;animation-delay:.18s}
  .p-art .bars span:nth-child(3){height:13px;animation-delay:.36s}
  .p-art .bars span:nth-child(4){height:16px;animation-delay:.54s}
  @keyframes eq{0%,100%{transform:scaleY(.4)}50%{transform:scaleY(1)}}
  .p-info{flex:1 1 240px;min-width:0}
  .p-name{
    font-size:15.5px;font-weight:600;letter-spacing:.1px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .p-sub{font-size:12.5px;color:#86868B;margin-top:4px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .p-ctrls{display:flex;align-items:center;gap:10px;flex:0 0 auto}
  .p-btn{
    border-radius:50%;display:grid;place-items:center;
    transition:transform .2s ease,background .2s ease,filter .2s ease;
  }
  .p-btn.main{
    width:50px;height:50px;background:#0071E3;color:#FFFFFF;
    box-shadow:0 6px 18px rgba(0,113,227,.28);
  }
  .p-btn.main:hover{filter:brightness(1.07);transform:scale(1.05)}
  .p-btn.main svg{width:20px;height:20px;display:block}
  .p-btn.ghost{
    width:38px;height:38px;background:#F5F7FA;color:#6E6E73;font-size:15px;
  }
  .p-btn.ghost:hover{background:#EDEFF3;color:#1D1D1F}
  .p-vol{display:flex;align-items:center;gap:10px;flex:0 0 auto;width:150px}
  .p-vol .vol-ico{font-size:13px;color:#A1A1A6;width:16px;text-align:center}
  input[type=range]{
    -webkit-appearance:none;appearance:none;flex:1;height:4px;border-radius:4px;outline:none;cursor:pointer;
    background:linear-gradient(90deg,#0071E3 var(--p,70%),rgba(0,0,0,.10) var(--p,70%));
  }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;width:15px;height:15px;border-radius:50%;
    background:#FFFFFF;border:none;box-shadow:0 1px 5px rgba(0,0,0,.28);
  }
  input[type=range]::-moz-range-thumb{
    width:15px;height:15px;border-radius:50%;background:#FFFFFF;border:none;
    box-shadow:0 1px 5px rgba(0,0,0,.28);
  }
  .p-btn .spin{width:16px;height:16px;border-width:2px;border-color:rgba(255,255,255,.35);border-top-color:#FFF}

  /* ============ 页脚 ============ */
  .site-foot{
    max-width:1000px;margin:0 auto;padding:44px 24px 40px;
    text-align:center;font-size:12.5px;color:#A1A1A6;line-height:1.9;
  }
  .site-foot a{color:#86868B;border-bottom:1px solid rgba(0,0,0,.10)}

  /* ============ 移动端 ============ */
  @media (max-width:640px){
    body{padding-bottom:186px}
    .home-head{padding:52px 20px 34px}
    .home-head h1{font-size:34px}
    .home-head p{font-size:15px}
    .cat-grid{grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;padding:0 20px}
    .cat-card{padding:28px 14px 24px;border-radius:18px}
    .cat-emoji{font-size:30px}
    .cat-label{font-size:17px}
    .cat-count{font-size:12px}
    .list-bar{padding:14px 18px 12px}
    .list-title{font-size:21px}
    .list-count{margin-left:0;width:100%}
    .station-grid{padding:16px 18px 30px;grid-template-columns:1fr}
    .player{bottom:12px;gap:12px;padding:12px 14px;border-radius:22px}
    .p-info{flex:1 1 100%}
    .p-vol{width:100%;flex:1 1 100%}
  }
</style>
</head>

    { key:"ethnic",    label:"民族综合",   re:/民族|minority|ethnic/i }
  ];

  var REGIONS = [
    { label:"内蒙古",      re:/内蒙古|内蒙|阿拉善|锡林郭勒|呼伦贝尔|赤峰|通辽|鄂尔多斯|包头|乌海|兴安盟|巴彦淖尔|乌兰察布|呼和浩特/i },
    { label:"新疆",        re:/新疆|乌鲁木齐|喀什|和田|阿克苏|库尔勒|伊犁|塔城|阿勒泰|哈密|克拉玛依|吐鲁番|博尔塔拉|昌吉|克孜勒苏|石河子/i },
    { label:"西藏",        re:/西藏|拉萨|日喀则|林芝|那曲|藏北/i },
    { label:"云南",        re:/云南|德宏|西双版纳|大理|丽江|怒江|迪庆|红河|文山|楚雄|临沧|普洱|保山/i },
    { label:"四川甘孜阿坝", re:/甘孜|阿坝|凉山|康定|马尔康|西昌/i },
    { label:"青海",        re:/青海|西宁|海西|海北|黄南|果洛|玉树/i },
    { label:"甘肃",        re:/甘南|临夏|夏河/i },
    { label:"延边",        re:/延边|延吉|图们|珲春|龙井/i },
    { label:"东北民族地区", re:/长白|白山|鹤岗|牡丹江/i },
    { label:"贵州",        re:/贵州|黔东南|黔南|黔西南|凯里|都匀|兴义/i },
    { label:"广西",        re:/广西|南宁|柳州|桂林|百色|河池|崇左|来宾|贺州/i },
    { label:"湘鄂渝",      re:/湘西|恩施|张家界|怀化|黔江/i },
    { label:"海南",        re:/海南|三亚|五指山|琼中|陵水/i }
  ];

  var BLOCK_NAME = /净宗|念佛|弘化|法師|法师|净空|悟道|佛堂|講堂|讲堂|禪寺|禅寺|苗栗|竹苗|基北桃|乡村广播|測試|test|^\s*$/i;

  /* 人工核验后的修正表 --------------------------------------------------
     DEAD_NAMES：名字本身就不该出现的（误收录/名不副实）→ 直接丢弃。
     DEAD_URLS ：源已失效但先保留（让用户看得见、点得着）→ 列表里沉底并标「已失效」。
     两处修改都要同步到 build-data.js 一侧的抽取结果（自动，无需另改）。
     ------------------------------------------------------------------- */
  var DEAD_NAMES = /山东维语都市广播/;
  var DEAD_URLS = [
    "https://tvpull.hmgbtv.com/",   // 哈密维语广播（域名不可达）
    "https://klmysjtzb.rcsxzx.com/" // 克拉玛依维吾尔语综合广播（HLS 无响应）
  ];

  function isDeadUrl(u) {
    for (var i = 0; i < DEAD_URLS.length; i++) {
      if (String(u || "").indexOf(DEAD_URLS[i]) === 0) return true;
    }
    return false;
  }

  /* =====================================================================
     工具：超时 / 取数
     ===================================================================== */
  function withTimeout(promise, ms, label) {
    return Promise.race([
      promise,
      new Promise(function (_, reject) {
        setTimeout(function () { reject(new Error((label || "请求") + " 超时")); }, ms);
      })
    ]);
  }

  function getJSON(url) {
    return fetch(url, { cache: "no-store", headers: { Accept: "application/json" } })
      .then(function (r) {
        if (!r.ok) throw new Error("HTTP " + r.status);
        return r.json();
      });
  }

  function strip(u) { return (u || "").replace(/\s+/g, ""); }
  function isHls(u) { return /\.m3u8(\?|#|$)/i.test(u); }

  function nameKey(n) {
    return String(n)
      .replace(/[（(][^）)]*[）)]/g, "")
      .replace(/(FM|AM)\s*\d+(\.\d+)?/gi, "")
      .replace(/[^0-9A-Za-z\u4e00-\u9fff\uac00-\ud7af\u3040-\u30ff]/g, "")
      .toLowerCase();
  }

  function classify(name, tags) {
    var blob = name + " " + tags, i;
    for (i = 0; i < LANGS.length; i++) {
      if (LANGS[i].re.test(blob)) {
        return { key: LANGS[i].key, label: LANGS[i].label, tier: "lang", region: "" };
      }
    }
    for (i = 0; i < REGIONS.length; i++) {
      if (REGIONS[i].re.test(blob)) {
        return { key: "region", label: "民族地区", tier: "region", region: REGIONS[i].label };
      }
    }
    return null;
  }

  /* 实时原始数据 → 站内统一结构 */
  function build(raw) {
    var seenUrl = Object.create(null), seenName = Object.create(null), out = [];

    raw.forEach(function (s) {
      if (!s) return;
      var name = (s.name || "").replace(/\s+/g, " ").trim();
      var tags = (s.tags || "").trim();
      if (!name || BLOCK_NAME.test(name)) return;

      if (DEAD_NAMES.test(name)) return;

      var cat = classify(name, tags);
      if (!cat) return;

      var url = strip(s.url_resolved || s.url || "");
      if (!url || !/^https?:\/\//i.test(url)) return;
      if (seenUrl[url]) return;

      var nk = nameKey(name);
      if (nk && seenName[nk]) {
        var prev = seenName[nk];
        var better = (url.indexOf("https://") === 0 && prev.url.indexOf("https://") !== 0) ||
          ((url.indexOf("https://") === 0) === (prev.url.indexOf("https://") === 0) &&
            (s.bitrate || 0) > (prev.bitrate || 0));
        if (!better) return;
        out.splice(out.indexOf(prev), 1);
      }

      var item = {
        id: s.stationuuid || (name + url),
        name: name,
        tags: tags ? tags.split(",").map(function (t) { return t.trim(); }).filter(Boolean).slice(0, 3) : [],
        url: url,
        cat: cat.key,
        catLabel: cat.tier === "region" ? "民族地区 · " + cat.region : cat.label,
        codec: (s.codec || "").toUpperCase(),
        bitrate: s.bitrate || 0
      };
      seenUrl[url] = true;
      if (nk) seenName[nk] = item;
      out.push(item);
    });

    var order = { region: LANGS.length };
    LANGS.forEach(function (c, i) { order[c.key] = i; });
    out.sort(function (a, b) {
      /* 已失效的电台永远沉到列表最后 */
      var da = isDeadUrl(a.url) ? 1 : 0, db = isDeadUrl(b.url) ? 1 : 0;
      if (da !== db) return da - db;
      var d = (order[a.cat] === undefined ? 99 : order[a.cat]) - (order[b.cat] === undefined ? 99 : order[b.cat]);
      return d !== 0 ? d : a.name.localeCompare(b.name, "zh-Hans-CN");
    });
    return out;
  }

  /* 同域烤好的数据 → 统一结构（宽松归一化，字段缺失也能用） */
  function normalize(data) {
    var list = (data && data.stations) ? data.stations : data;
    if (!Array.isArray(list)) return [];
    var dead = [];
    var live = list.map(function (s, i) {
      return {
        id: s.id || ("s" + i),
        name: s.name || "未命名电台",
        tags: Array.isArray(s.tags) ? s.tags.slice(0, 3) : [],
        url: strip(s.url || ""),
        cat: s.cat || "region",
        catLabel: s.catLabel || "民族地区",
        codec: (s.codec || "").toUpperCase(),
        bitrate: s.bitrate || 0
      };
    }).filter(function (s) {
      if (!/^https?:\/\//i.test(s.url)) return false;
      if (isDeadUrl(s.url)) { dead.push(s); return false; }
      return true;
    });
    return live.concat(dead);   // 已失效的沉底
  }

  /* =====================================================================
     状态
     ===================================================================== */
  var ALL = [];
  var MODE = "live";           // live | fallback

  var hls = null;
  var candidates = [];
  var candIdx = 0;

  function renderHome() {

  function renderList(key) {
    var cat = null;
    for (var i = 0; i < CATS.length; i++) if (CATS[i].key === key) cat = CATS[i];
    if (!cat) return renderHome();

    var list = ALL.filter(function (s) { return cat.match(s); });

    $("view-home").hidden = true;
    $("view-list").hidden = false;
    document.title = cat.label + " · 华韵集";
    $("listTitle").textContent = cat.label;
    $("listCount").textContent = list.length + " 个电台";

    var box = $("stationGrid");
    box.innerHTML = "";

    if (!list.length) {
      var d = document.createElement("div");
      d.className = "empty";
      d.innerHTML = "该分类暂时没有可用电台。<br>点击左上角「⬅ 返回分类」换个分类试试。";
      box.appendChild(d);
      syncCards();
      return;
    }

    list.forEach(function (s) { box.appendChild(makeCard(s)); });
    syncCards();
    window.scrollTo({ top: 0, behavior: "auto" });
  }

  function applyRoute() {
    if (!ALL.length) return;
    var h = location.hash || "#/home";
    var m = h.match(/^#\/c\/([A-Za-z0-9_-]+)$/);
    if (m) {
      var ok = CATS.some(function (c) { return c.key === m[1]; });
      if (ok) return renderList(m[1]);

    renderHome();

  /* =====================================================================
     卡片
     ===================================================================== */
  function makeCard(s) {
    var card = document.createElement("article");
    card.className = "station-card";
    card.setAttribute("data-id", s.id);

    var head = document.createElement("div");
    var nm = document.createElement("h3");
    nm.className = "s-name";
    nm.textContent = s.name;
    var ct = document.createElement("div");
    ct.className = "s-cat";
    ct.textContent = s.catLabel;
    head.appendChild(nm); head.appendChild(ct);

    var tags = document.createElement("div");
    tags.className = "s-tags";
    (s.tags || []).forEach(function (t) {
      var el = document.createElement("span");
      el.className = "s-tag";
      el.textContent = t;
      tags.appendChild(el);
    });

    if (isDeadUrl(s.url)) {
      card.classList.add("is-dead");
      var dt = document.createElement("span");
      dt.className = "s-tag dead";
      dt.textContent = "已失效";
      tags.appendChild(dt);
    }

    var foot = document.createElement("div");
    foot.className = "s-foot";
    var meta = document.createElement("span");
    meta.className = "s-meta";
    var bits = [];
    if (s.codec && s.codec !== "UNKNOWN") bits.push(s.codec);
    if (s.bitrate) bits.push(s.bitrate + " kbps");
    bits.push(isHls(s.url) ? "HLS" : "直播");
    meta.textContent = bits.join(" · ");

    var btn = document.createElement("button");
    btn.type = "button";
    btn.className = "s-play";
    btn.innerHTML = ICON_PLAY;
    btn.setAttribute("aria-label", "播放 " + s.name);

    foot.appendChild(meta); foot.appendChild(btn);
    card.appendChild(head);
    if (tags.childNodes.length) card.appendChild(tags);
    card.appendChild(foot);

    function hit(e) { e.stopPropagation(); toggleStation(s); }
    btn.addEventListener("click", hit);
    card.addEventListener("click", function () { toggleStation(s); });
    return card;
  }

  /* =====================================================================
     播放核心
     ===================================================================== */
  function candidateUrls(item) {
    var list = [], u = item.url;
    if (u.indexOf("https://") === 0) {
      list.push({ url: u, proxied: false });
    } else {
      list.push({ url: u.replace(/^http:\/\//i, "https://"), proxied: false });
      list.push({ url: PROXY + encodeURIComponent(u), proxied: true, origin: u });
      list.push({ url: u, proxied: false });
    }
    var seen = Object.create(null);
    return list.filter(function (c) {
      if (!c.url || seen[c.url]) return false;
      seen[c.url] = true; return true;
    });
  }

  function destroyHls() {
    if (hls) { try { hls.destroy(); } catch (e) {} hls = null; }
  }

  function hardStop() {
    destroyHls();
    try { audio.pause(); } catch (e) {}
    audio.removeAttribute("src");
    try { audio.load(); } catch (e) {}
  }

  function busy() { return $("player").classList.contains("is-loading") && !!current; }

  function updatePlayer(state, text) {
    var p = $("player"), btn = $("pToggle"), art = $("pArt");
    p.classList.remove("is-loading", "is-playing", "is-error");
    p.classList.add("up");

    if (state === "loading") { p.classList.add("is-loading"); art.textContent = "♪"; btn.innerHTML = '<span class="spin"></span>'; }
    else if (state === "playing") {
      p.classList.add("is-playing");
      art.innerHTML = '<span class="bars"><span></span><span></span><span></span><span></span></span>';
      btn.innerHTML = ICON_PAUSE;
    } else if (state === "error") { p.classList.add("is-error"); art.textContent = "!"; btn.innerHTML = ICON_PLAY; }
    else { art.textContent = "♪"; btn.innerHTML = ICON_PLAY; }

    btn.disabled = !current;
    $("pSub").textContent = text || "";
    syncCards();
  }

  function syncCards() {
    var cards = document.querySelectorAll(".station-card");
    for (var i = 0; i < cards.length; i++) {
      var c = cards[i];
      var isCur = !!(current && c.getAttribute("data-id") === current.id);
      c.classList.toggle("is-current", isCur);
      var b = c.querySelector(".s-play");
      if (!b) continue;
      if (isCur && busy()) b.innerHTML = '<span class="spin" style="border-color:rgba(255,255,255,.35);border-top-color:#fff"></span>';
      else if (isCur && !audio.paused) b.innerHTML = ICON_PAUSE;
      else b.innerHTML = ICON_PLAY;
    }
  }

  function fail(extra) {
    toast("该直播源暂时不可用，请换个电台" + (extra ? "（" + extra + "）" : ""));
    updatePlayer("error", "连接失败 · 可换台或点 ↻ 重试");
  }

  function loadCandidate() {
    if (!current) return;
    if (candIdx >= candidates.length) { fail("已尝试 " + candidates.length + " 条线路"); return; }

    var cand = candidates[candIdx++];
    var url = cand.url;
    destroyHls();
    updatePlayer("loading", "正在连接…（线路 " + candIdx + "/" + candidates.length + "）");

    var needsHls = isHls(url);

    if (needsHls) {
      if (window.Hls && window.Hls.isSupported()) {
        hls = new window.Hls({
          lowLatencyMode: false, enableWorker: true, maxBufferLength: 20,
          manifestLoadingMaxRetry: 1, levelLoadingMaxRetry: 1, fragLoadingMaxRetry: 2,
          manifestLoadingTimeOut: 8000, levelLoadingTimeOut: 8000, fragLoadingTimeOut: 12000
        });
        var settled = false;
        hls.on(window.Hls.Events.MANIFEST_PARSED, function () { settled = true; play(); });
        hls.on(window.Hls.Events.ERROR, function (evt, data) {
          if (!data || !data.fatal) return;
          if (data.type === window.Hls.ErrorTypes.MEDIA_ERROR) {
            try { hls.recoverMediaError(); return; } catch (e) {}
          }
          if (!settled) { settled = true; loadCandidate(); }
        });
        setTimeout(function () {
          if (!settled && !audio.currentTime) { settled = true; loadCandidate(); }
        }, 9000);
        try { hls.loadSource(url); hls.attachMedia(audio); }
        catch (e) { loadCandidate(); }
      } else if (audio.canPlayType("application/vnd.apple.mpegurl")) {
        audio.src = url;      // Safari 原生 HLS
        play();
      } else {
        loadCandidate();
      }
    } else {
      audio.src = url;
      play();
    }
  }

  function play() {
    var p = audio.play();
    if (p && p.catch) {
      p.catch(function (err) {
        if (err && err.name === "NotAllowedError") fail("浏览器拦截了自动播放，请再点一次");
        else loadCandidate();
      });
    }
  }

  function selectStation(item, force) {
    if (!force && current && current.id === item.id) return;
    current = item;
    candidates = candidateUrls(item);
    candIdx = 0;
    retried = false;
    $("pName").textContent = item.name;
    $("pName").title = item.name;
    updatePlayer("loading", "正在连接…");
    loadCandidate();
  }

  function toggleStation(item) {
    if (current && current.id === item.id && !$("player").classList.contains("is-error")) {
      if (audio.paused) { updatePlayer("loading", "继续播放…"); play(); }
      else audio.pause();
      return;
    }
    selectStation(item, true);
  }

  /* =====================================================================
     音频事件
     ===================================================================== */
  audio.addEventListener("playing", function () {
    retried = false;
    updatePlayer("playing", "正在直播" + (current && current.catLabel ? " · " + current.catLabel : ""));
  });
  audio.addEventListener("pause", function () {
    if ($("player").classList.contains("is-error")) return;
    updatePlayer("idle", "已暂停");
  });
  audio.addEventListener("waiting", function () { if (current) updatePlayer("loading", "缓冲中…"); });
  audio.addEventListener("stalled", function () { if (current) updatePlayer("loading", "网络波动，正在重新缓冲…"); });
  audio.addEventListener("error", function () {
    if (!current) return;
    if (!retried) { retried = true; updatePlayer("loading", "连接中断，换线路重试…"); }
    loadCandidate();
  });
  audio.addEventListener("ended", function () { updatePlayer("idle", "直播已结束"); });

  $("pToggle").addEventListener("click", function () {
    if (!current) return;
    if (audio.paused) { updatePlayer("loading", "继续播放…"); play(); }
    else audio.pause();
  });
  $("pRetry").addEventListener("click", function () {
    if (!current) { toast("还没有选择电台"); return; }
    candIdx = 0; retried = false; hardStop();
    updatePlayer("loading", "重新连接…");
    loadCandidate();
  });
  $("pClose").addEventListener("click", function () {
    hardStop();
    current = null;
    $("player").classList.remove("up");
    $("pName").textContent = "未选择电台";
    syncCards();
  });

  /* 音量 */
  var vol = $("vol");
  function applyVol() {
    audio.volume = Math.min(1, Math.max(0, vol.value / 100));
    audio.muted = Number(vol.value) === 0;
    $("volIco").textContent = Number(vol.value) === 0 ? "🔇" : (vol.value < 45 ? "🔈" : "🔊");
    vol.style.setProperty("--p", vol.value + "%");
    try { localStorage.setItem("hy.vol", vol.value); } catch (e) {}
  }
  vol.addEventListener("input", applyVol);
  try {
    var sv = localStorage.getItem("hy.vol");
    if (sv !== null) vol.value = sv;
  } catch (e) {}
  applyVol();

  /* Toast */
  var toastTimer = null;
  function toast(msg, ms) {
    var el = $("toast");
    el.textContent = msg;
    el.classList.add("on");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { el.classList.remove("on"); }, ms || 3800);
  }

  /* 返回分类 */
  $("btnBack").addEventListener("click", function () { location.hash = "#/home"; });
  window.addEventListener("hashchange", applyRoute);

  /* 键盘：空格播放/暂停 */
  document.addEventListener("keydown", function (e) {
    if (e.code === "Space" && current && document.activeElement.tagName !== "INPUT") {
      e.preventDefault();
      if (audio.paused) play(); else audio.pause();
    }
  });

  /* =====================================================================
     启动：同域数据 → 实时 API → 写死的兜底数组
     ===================================================================== */
  function setNotice(text) {
    [$("notice"), $("notice2")].forEach(function (n) {
      if (!n) return;
      n.textContent = text || "";
      n.hidden = !text;
    });
  }

  async function boot() {
    var list = null;
    var usedFallback = false;

    try {
      var baked = await withTimeout(getJSON("stations.json?v=" + Date.now()), TIMEOUT, "本地数据");
      list = normalize(baked);
      if (!list.length) throw new Error("本地数据为空");
    } catch (e1) {
      list = null;
      for (var i = 0; i < MIRRORS.length && !list; i++) {
        try {
          showLoading("正在连接备用服务器…");
          var raw = await withTimeout(getJSON(MIRRORS[i] + QUERY), TIMEOUT, "备用服务器");
          var built = build(raw);
          if (built.length) list = built;
        } catch (e2) {
          list = null;
        }
      }
    }

    if (!list || !list.length) {
      list = FALLBACK.slice();
      usedFallback = true;
    }

    ALL = list;
    MODE = usedFallback ? "fallback" : "live";

    hideLoading();

    if (usedFallback) {
      setNotice("网络请求失败，已切换至精选电台");
      toast("网络请求失败，已切换至精选电台", 5000);
    }

    applyRoute();
  }

  function bootSafe() {
    boot().catch(function () {
      // 最后一层保险：任何意外都不允许停在 Loading 或空白
      ALL = FALLBACK.slice();
      MODE = "fallback";
      hideLoading();
      setNotice("网络请求失败，已切换至精选电台");
      applyRoute();
    });
  }

  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", bootSafe);
  else bootSafe();
})();
</script>
</body>
</html>
